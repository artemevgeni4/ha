<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг 116a</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            color: #222;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .top-widget-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 10px 0;
        }
        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            text-align: center;
        }
        .value-display {
            font-size: 56px;
            font-weight: 700;
            color: #d62020;
            line-height: 1.1;
            text-align: center;
            min-width: 140px;
            font-variant-numeric: tabular-nums;
            transition: color 0.2s ease;
        }
        .unit-label {
            font-size: 16px;
            font-weight: 600;
            color: #555;
            margin-top: 2px;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            padding: 15px;
            width: 100%;
        }
        .chart-container {
            width: 100%;
            height: 240px;
            margin-top: 8px;
        }
        .chart-container svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }
        .status-text {
            font-size: 11px;
            color: #888;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-widget-area">
            <div class="card-title">Текущее напряжение</div>
            <div class="value-display" id="current-value">---</div>
        </div>

        <div class="card">
            <div class="card-title">Динамика (последние 60 значений)</div>
            <div class="chart-container" id="svg-chart"></div>
            <div class="status-text" id="last-update">Загрузка данных...</div>
        </div>
    </div>

    <script>
        const CHANNEL_ID = '3585762';
        const FIELD_NUM = 1;
        const READ_API_KEY = 'YL11HJZ4W6W2VTMP';

        const SLASH = String.fromCharCode(47);
        const directUrl = [
            'https:',
            '',
            'api.thingspeak.com',
            'channels',
            CHANNEL_ID,
            'feeds.json?api_key=' + READ_API_KEY + '&results=60'
        ].join(SLASH);

        function getVoltageColor(voltage) {
            if (voltage < 180 || voltage >= 245) {
                return '#d62020'; // Красный: < 180 и >= 245
            }
            if (voltage >= 180 && voltage < 200) {
                return '#e5a000'; // Жёлтый: 180–200
            }
            return '#2e8b3c'; // Зелёный: 200–245
        }

        function drawSvgChart(values, labels, accentColor) {
            const container = document.getElementById('svg-chart');
            if (!values || values.length === 0) return;

            const color = accentColor || '#d62020';
            const width = 500;
            const height = 220;
            const padLeft = 42;
            const padRight = 12;
            const padTop = 15;
            const padBottom = 25;

            const plotW = width - padLeft - padRight;
            const plotH = height - padTop - padBottom;

            let minVal = Math.min.apply(null, values);
            let maxVal = Math.max.apply(null, values);

            if (minVal === maxVal) {
                minVal -= 1;
                maxVal += 1;
            } else {
                const margin = (maxVal - minVal) * 0.1;
                minVal = Math.floor((minVal - margin) * 10) / 10;
                maxVal = Math.ceil((maxVal + margin) * 10) / 10;
            }

            const midVal = ((minVal + maxVal) / 2).toFixed(1);

            const points = values.map(function(v, index) {
                const x = padLeft + (values.length === 1 ? plotW / 2 : (index / (values.length - 1)) * plotW);
                const y = padTop + plotH - ((v - minVal) / (maxVal - minVal)) * plotH;
                return x.toFixed(1) + ',' + y.toFixed(1);
            });

            const firstX = padLeft;
            const lastX = padLeft + plotW;
            const bottomY = padTop + plotH;
            const areaPoints = firstX + ',' + bottomY + ' ' + points.join(' ') + ' ' + lastX + ',' + bottomY;

            const startTime = labels[0] || '';
            const midTime = labels[Math.floor(labels.length / 2)] || '';
            const endTime = labels[labels.length - 1] || '';

            const svgHtml = [
                '<svg viewBox="0 0 ' + width + ' ' + height + '" preserveAspectRatio="none">',
                '<defs>',
                '<linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">',
                '<stop offset="0%" stop-color="' + color + '" stop-opacity="0.25"/>',
                '<stop offset="100%" stop-color="' + color + '" stop-opacity="0.02"/>',
                '</linearGradient>',
                '</defs>',
                '<line x1="' + padLeft + '" y1="' + padTop + '" x2="' + lastX + '" y2="' + padTop + '" stroke="#eeeeee" stroke-width="1"/>',
                '<line x1="' + padLeft + '" y1="' + (padTop + plotH / 2) + '" x2="' + lastX + '" y2="' + (padTop + plotH / 2) + '" stroke="#eeeeee" stroke-width="1"/>',
                '<line x1="' + padLeft + '" y1="' + bottomY + '" x2="' + lastX + '" y2="' + bottomY + '" stroke="#dddddd" stroke-width="1"/>',
                '<text x="' + (padLeft - 6) + '" y="' + (padTop + 4) + '" font-size="11" fill="#888" text-anchor="end">' + maxVal.toFixed(1) + '</text>',
                '<text x="' + (padLeft - 6) + '" y="' + (padTop + plotH / 2 + 4) + '" font-size="11" fill="#888" text-anchor="end">' + midVal + '</text>',
                '<text x="' + (padLeft - 6) + '" y="' + (bottomY + 4) + '" font-size="11" fill="#888" text-anchor="end">' + minVal.toFixed(1) + '</text>',
                '<polygon points="' + areaPoints + '" fill="url(#grad)"/>',
                '<polyline fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="' + points.join(' ') + '"/>',
                '<text x="' + padLeft + '" y="' + (height - 4) + '" font-size="11" fill="#888" text-anchor="start">' + startTime + '</text>',
                '<text x="' + (padLeft + plotW / 2) + '" y="' + (height - 4) + '" font-size="11" fill="#888" text-anchor="middle">' + midTime + '</text>',
                '<text x="' + lastX + '" y="' + (height - 4) + '" font-size="11" fill="#888" text-anchor="end">' + endTime + '</text>',
                '</svg>'
            ].join('');

            container.innerHTML = svgHtml;
        }

        function renderData(data) {
            const statusEl = document.getElementById('last-update');
            const valEl = document.getElementById('current-value');
            const feeds = data.feeds;

            if (!feeds || feeds.length === 0) {
                statusEl.textContent = 'Канал пуст';
                return;
            }

            const labels = [];
            const values = [];

            feeds.forEach(function(feed) {
                const val = parseFloat(feed['field' + FIELD_NUM]);
                if (!isNaN(val)) {
                    const date = new Date(feed.created_at);
                    labels.push(date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }));
                    values.push(val);
                }
            });

            if (values.length > 0) {
                const latestVoltage = values[values.length - 1];
                const activeColor = getVoltageColor(latestVoltage);
                valEl.textContent = latestVoltage;
                valEl.style.color = activeColor;
                drawSvgChart(values, labels, activeColor);

                const now = new Date().toLocaleTimeString('ru-RU');
                statusEl.textContent = 'Обновлено: ' + now;
            }
        }

        async function loadData() {
            const statusEl = document.getElementById('last-update');
            const valEl = document.getElementById('current-value');

            const proxyUrls = [
                directUrl,
                'https://allorigins.win' + encodeURIComponent(directUrl),
                'https://codetabs.com' + encodeURIComponent(directUrl)
            ];

            for (let i = 0; i < proxyUrls.length; i++) {
                try {
                    const res = await fetch(proxyUrls.at(i));
                    if (!res.ok) continue;
                    const text = await res.text();
                    const json = JSON.parse(text);
                    renderData(json);
                    return;
                } catch (e) {
                    // Переход к следующему резервному каналу
                }
            }

            valEl.textContent = 'Ошибка';
            valEl.style.color = '#888888';
            statusEl.textContent = 'Не удалось получить данные';
        }

        loadData();
        setInterval(loadData, 15000);
    </script>

</body>
</html>
