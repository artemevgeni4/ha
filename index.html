<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг 116a VOLT</title>
    <script src="https://cloudflare.com"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            color: #222;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .top-widget-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 10px 0;
        }
        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            text-align: center;
        }
        .value-display {
            font-size: 56px;
            font-weight: 700;
            color: #d62020;
            line-height: 1.1;
            text-align: center;
            min-width: 140px;
            font-variant-numeric: tabular-nums;
        }
        .unit-label {
            font-size: 16px;
            font-weight: 600;
            color: #555;
            margin-top: 2px;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            padding: 15px;
            width: 100%;
        }
        .chart-container {
            position: relative;
            width: 100%;
            height: 280px;
        }
        .status-text {
            font-size: 11px;
            color: #888;
            margin-top: 8px;
            text-align: center;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-widget-area">
            <div class="card-title">Текущие показания</div>
            <div class="value-display" id="current-value">---</div>
            <div class="unit-label">VOLT</div>
        </div>

        <div class="card">
            <div class="card-title">Динамика (последние 60 значений)</div>
            <div class="chart-container">
                <canvas id="sensorChart"></canvas>
            </div>
            <div class="status-text" id="last-update">Загрузка данных...</div>
        </div>
    </div>

    <script>
        const CHANNEL_ID = '3585762';
        const FIELD_NUM = 1;
        const READ_API_KEY = 'YL11HJZ4W6W2VTMP'; 

        // Собираем URL по частям, чтобы исключить искажение символов при копировании
        const SLASH = String.fromCharCode(47);
        const directUrl = [
            'https:',
            '',
            'api.thingspeak.com',
            'channels',
            CHANNEL_ID,
            'feeds.json?api_key=' + READ_API_KEY + '&results=60'
        ].join(SLASH);

        let chart = null;

        if (typeof Chart !== 'undefined') {
            const ctx = document.getElementById('sensorChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Напряжение (V)',
                        data: [],
                        borderColor: '#d62020',
                        backgroundColor: 'rgba(214, 32, 32, 0.1)',
                        borderWidth: 2,
                        pointRadius: 2,
                        tension: 0.2,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { maxTicksLimit: 6, font: { size: 11 } }, grid: { display: false } },
                        y: { ticks: { font: { size: 11 } } }
                    }
                }
            });
        }

        function renderData(data) {
            const statusEl = document.getElementById('last-update');
            const valEl = document.getElementById('current-value');
            const feeds = data.feeds;

            if (!feeds || feeds.length === 0) {
                statusEl.textContent = 'Канал пуст (нет записей в feeds)';
                return;
            }

            const labels = [];
            const values = [];

            feeds.forEach(function(feed) {
                const val = parseFloat(feed['field' + FIELD_NUM]);
                if (!isNaN(val)) {
                    const date = new Date(feed.created_at);
                    labels.push(date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }));
                    values.push(val);
                }
            });

            if (values.length > 0) {
                valEl.textContent = values[values.length - 1];

                if (chart) {
                    const firstDataset = chart.data.datasets.at(0);
                    firstDataset.data = values;
                    chart.data.labels = labels;
                    chart.update();
                }

                const now = new Date().toLocaleTimeString('ru-RU');
                statusEl.textContent = 'Обновлено: ' + now;
            } else {
                const sample = JSON.stringify(feeds.at(feeds.length - 1));
                statusEl.textContent = 'В field1 нет цифр. Последняя запись: ' + sample;
            }
        }

        async function loadData() {
            const statusEl = document.getElementById('last-update');
            const valEl = document.getElementById('current-value');

            const proxyUrls = [
                directUrl,
                'https://allorigins.win' + encodeURIComponent(directUrl),
                'https://codetabs.com' + encodeURIComponent(directUrl)
            ];

            let errors = [];

            for (let i = 0; i < proxyUrls.length; i++) {
                try {
                    const res = await fetch(proxyUrls.at(i));
                    const text = await res.text();
                    if (!res.ok) {
                        errors.push('Метод ' + (i + 1) + ': HTTP ' + res.status);
                        continue;
                    }
                    const json = JSON.parse(text);
                    renderData(json);
                    return;
                } catch (e) {
                    errors.push('Метод ' + (i + 1) + ': ' + e.message);
                }
            }

            valEl.textContent = 'Ошибка';
            statusEl.textContent = errors.join(' | ');
        }

        loadData();
        setInterval(loadData, 15000);
    </script>

</body>
</html>
